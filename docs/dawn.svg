<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="42%" stop-color="#213050"/>
      <stop offset="70%" stop-color="#7a5069"/>
      <stop offset="88%" stop-color="#d98a5a"/>
      <stop offset="100%" stop-color="#f5b268"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="38%" stop-color="#ffca70" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="f"><rect width="880" height="280" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#f)">
    <rect width="880" height="280" fill="url(#sky)"/>

    <!-- last stars, fading upward -->
    <g fill="#ffffff">
      <circle cx="120" cy="34" r="1.3" opacity="0.55"/><circle cx="256" cy="22" r="1.0" opacity="0.40"/>
      <circle cx="392" cy="46" r="1.2" opacity="0.35"/><circle cx="548" cy="28" r="1.0" opacity="0.45"/>
      <circle cx="700" cy="40" r="1.3" opacity="0.30"/><circle cx="812" cy="20" r="1.1" opacity="0.42"/>
      <circle cx="184" cy="72" r="0.9" opacity="0.25"/><circle cx="628" cy="66" r="0.9" opacity="0.22"/>
    </g>

    <!-- the sun, only just up -->
    <circle cx="440" cy="228" r="150" fill="url(#sun)" opacity="0.85"/>
    <circle cx="440" cy="228" r="42" fill="#fff0c9" opacity="0.95"/>

    <!-- horizon -->
    <path d="M0 228 L880 228" stroke="#ffd8a1" stroke-opacity="0.35" stroke-width="1.2"/>
    <path d="M0 232 C 120 226, 210 240, 330 232 C 450 224, 540 240, 660 232 C 760 225, 820 238, 880 230 L880 280 L0 280 Z" fill="#150f16"/>
    <path d="M0 246 C 140 240, 240 254, 360 246 C 480 238, 580 252, 700 244 C 790 238, 840 250, 880 244 L880 280 L0 280 Z" fill="#0c090f"/>

    <!-- one thing leaving, on time -->
    <g stroke="#ffe6bd" stroke-opacity="0.75" fill="none" stroke-linecap="round">
      <path d="M596 132 q 12 -9 24 0" stroke-width="1.8"/>
      <path d="M624 132 q 12 -9 24 0" stroke-width="1.8"/>
    </g>
    <g stroke="#ffe6bd" stroke-opacity="0.35" fill="none" stroke-linecap="round">
      <path d="M676 104 q 9 -7 18 0" stroke-width="1.4"/>
      <path d="M700 118 q 8 -6 16 0" stroke-width="1.2"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="879" height="279" rx="10" fill="none" stroke="#22242b"/>
</svg>
